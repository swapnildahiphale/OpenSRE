[project]
name = "opensre-sre-agent"
version = "0.1.0"
description = "AI-powered SRE agent for automated incident investigation"
requires-python = ">=3.11"
dependencies = [
    # Core SDK
    "claude-agent-sdk==0.2.110",  # ClaudeSDKClient with interrupt support
    "anthropic>=0.40.0",
    "python-dotenv==1.2.1",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",

    # Infrastructure integrations
    "kubernetes>=34.1.0",
    "boto3>=1.34.0",  # AWS

    # Monitoring & Observability
    # Langfuse v4 (OpenTelemetry-based) powers both agent tracing and the
    # offline eval harness in evals/.
    "langfuse>=4.14.0,<5",
    "httpx>=0.28.1",
    "requests>=2.32.5",

    # Knowledge Graph
    "neo4j>=5.14.0",
    "langchain-neo4j>=0.1.0",  # used by tools/neo4j_semantic_layer.py
    "neo4j-graphrag>=1.18.0",  # vector retrieval for episodic memory
    "fastembed>=0.4.0",  # self-hosted embeddings for episodic memory

    # Utilities
    "pyyaml>=6.0",
    "mistune>=3.0.0",  # Markdown parser for the Jira ADF converter
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["agent.py", "events.py", "sandbox_server.py", "server.py", "sandbox_manager.py", "server_simple.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Required transitively: test_default_config_drift.py imports
    # config_service's core.hierarchical_config, which imports structlog.
    "structlog>=23.0.0",
]
