# Public-only release hook. Media generation runs in OpenSRE-private.
# Required repository secret:
#   OPEN_SRE_PRIVATE_DISPATCH_TOKEN — fine-grained token or GitHub App token
#   allowed to dispatch workflows/events to swapnildahiphale/OpenSRE-private

name: Dispatch release short worker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable public release tag to dispatch, e.g. v1.2.7"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private media worker
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPEN_SRE_PRIVATE_DISPATCH_TOKEN }}
          script: |
            const tag = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.tag
              : context.payload.release.tag_name;
            const identifier = '(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)';
            const tagPattern = new RegExp(`^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-${identifier}(?:\\.${identifier})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`);
            if (!tagPattern.test(tag)) {
              core.setFailed(`Release tag must be a semantic v* tag; got: ${tag}`);
              return;
            }

            const release = context.payload.release || {};
            await github.rest.repos.createDispatchEvent({
              owner: 'swapnildahiphale',
              repo: 'OpenSRE-private',
              event_type: 'opensre-release',
              client_payload: {
                public_repository: `${context.repo.owner}/${context.repo.repo}`,
                tag,
                release_id: release.id || null,
                release_url: release.html_url || `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
                source_sha: release.target_commitish || null,
              },
            });
            core.info(`Dispatched ${tag} to OpenSRE-private`);
