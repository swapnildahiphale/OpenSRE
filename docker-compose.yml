version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# OpenSRE — Local Development Stack
# ═══════════════════════════════════════════════════════════════════════════════
#
# Services:
#   Core: postgres, config-service, neo4j, sre-agent, web-ui
#   Optional: slack-bot (--profile slack / make dev-slack)
#             teams-bot (--profile teams / make dev-teams)
#             litellm (--profile litellm)
#
# Usage:
#   make dev         Start core services
#   make dev-teams   Core + Teams bot
#   make stop        Stop everything
#   make logs       Follow logs
#   make clean      Remove containers + volumes
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — backend for config-service
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: opensre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensre
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: opensre
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensre -d opensre"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────────────────────
  # Config Service — team config, tokens, audit logging
  # ─────────────────────────────────────────────────────────────────────────────
  config-service:
    build:
      context: ./config_service
      dockerfile: Dockerfile
    container_name: opensre-config-service
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/scripts/entrypoint-local.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://opensre:localdev@postgres:5432/opensre?sslmode=disable
      TOKEN_PEPPER: ${TOKEN_PEPPER:-localdev-pepper-must-be-32-chars-minimum!!}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      ADMIN_AUTH_MODE: token
      TEAM_AUTH_MODE: token
      SSO_DEFAULT_TEAM_NODE_ID: ${SSO_DEFAULT_TEAM_NODE_ID:-default}
      IMPERSONATION_JWT_SECRET: local-dev-impersonation-secret-32chars!!
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: console
      ENV_FILE_PATH: /repo/.env  # Path to .env file for write-back
    ports:
      - "8081:8080"
    volumes:
      # Mount config directory for YAML config in local mode
      - ./config_service/config:/app/config:rw
      # Mount repo root for .env write-back in local mode
      # (Mounting entire repo allows atomic file operations)
      - .:/repo:rw
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
      - default  # Needs host access for port publishing

  # ─────────────────────────────────────────────────────────────────────────────
  # Neo4j — Knowledge graph for service topology
  # ─────────────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:2026.02
    container_name: opensre-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-localdev}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────────────────────
  # LiteLLM Proxy — OPTIONAL multi-provider proxy (OpenRouter/others).
  # Not started by default; opt in with:  docker compose --profile litellm up
  # To route the agent through it, set ANTHROPIC_BASE_URL=http://litellm:4000.
  # ─────────────────────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: opensre-litellm
    profiles: ["litellm"]
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4001:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - app_network
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # SRE Agent — runs investigations (in-process, no K8s sandboxes)
  # ─────────────────────────────────────────────────────────────────────────────
  sre-agent:
    build:
      context: ./sre-agent
      dockerfile: Dockerfile
    container_name: opensre-sre-agent
    restart: unless-stopped
    # Anthropic DNS now points at 160.79.104.10, which fails TLS from some
    # networks (e.g. India). Cloudflare edge still works — temporary workaround.
    extra_hosts:
      - "api.anthropic.com:104.18.19.125"
    env_file:
      - .env
    environment:
      # Config service integration
      - CONFIG_SERVICE_URL=http://config-service:8080
      # Tenant context for config loading
      - OPENSRE_TENANT_ID=local
      - OPENSRE_TEAM_ID=default
      # LLM access — direct Anthropic by default (Claude Agent SDK engine).
      # To route via the optional LiteLLM proxy instead, start it with
      # `--profile litellm` and set ANTHROPIC_BASE_URL=http://litellm:4000.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # Neo4j — credentials from repo .env; URI is always in-network (not NEO4J_URI from .env)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-localdev}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      # Coralogix config
      - CORALOGIX_DOMAIN=${CORALOGIX_DOMAIN:-}
      # Skills filtering
      # Default empty so team-level skills config (skills.enabled/disabled, set
      # via the web UI) governs which skills load. Set ENABLED_SKILLS=all (or a
      # comma-separated list) to force an env-level override that bypasses team
      # config. Empty default keeps out-of-box behavior (all skills) while letting
      # the team-level Skills toggles take effect.
      - ENABLED_SKILLS=${ENABLED_SKILLS:-}
      # Investigation timeout (seconds; default 600 = 10 minutes)
      - AGENT_TIMEOUT_SECONDS=600
      # Durable session store for SDK conversation resume (persistent volume).
      - CLAUDE_CONFIG_DIR=/data/agent-sessions
      # LLM models — direct Anthropic vars from .env
      - MEMORY_LLM_MODEL=${MEMORY_LLM_MODEL:-claude-haiku-4-5-20251001}
      - SUMMARY_LLM_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - WRITEUP_LLM_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # Other services
      - LMNR_PROJECT_API_KEY=${LMNR_PROJECT_API_KEY:-}
      # Langfuse tracing. Unset by default — the agent auto-detects the backend
      # from whichever credentials are present, so leaving these blank is a no-op.
      # The Langfuse console hands out LANGFUSE_BASE_URL while older setups use
      # LANGFUSE_HOST, so pass both through rather than defaulting one of them to
      # a region the operator did not pick. The agent reconciles the two.
      - OBSERVABILITY_BACKEND=${OBSERVABILITY_BACKEND:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      # AWS + EKS connectivity (local dev). The agent runs skills in-process
      # (server_simple.py), so it needs direct access to your host AWS SSO creds
      # and kubeconfig. ~/.aws is mounted read-write so the aws CLI can refresh
      # expired SSO tokens; ~/.kube is read-only. VirtioFS remaps ownership so the
      # non-root agent (uid 1000) can read/write them without chmod. When the SSO
      # token expires, re-run `aws sso login` on the host (or let the container
      # refresh it automatically for the profile in use).
      # AWS_PROFILE/AWS_DEFAULT_REGION: default profile/region for boto3 skill
      # scripts (CloudWatch, EC2, ECS, Lambda). kubectl auth uses the per-context
      # AWS_PROFILE already baked into ~/.kube/config, so it is unaffected here.
      # Override either in .env if you want a different default account.
      # No org-specific profile default — set AWS_PROFILE in .env (or rely on
      # the profile already named in each kubeconfig context).
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      # Bitbucket (vcs-bitbucket skill): BKT_* vars come from env_file (.env) above.
      # Do not add empty BKT_PROJECT/BKT_REPO defaults here — unset is better than "".
      # GitHub (vcs-github skill): GITHUB_TOKEN / GITHUB_REPOSITORY come from env_file (.env) above.
    depends_on:
      config-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Note: Cannot use read_only:true because Claude Code CLI needs to write
    # But we limit writable locations with tmpfs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=500m
      # Must be uid/gid 1000 — without that the mount is root:root and
      # FastEmbed/HuggingFace cannot write model files under
      # /home/agent/.cache/huggingface (MEMORY-ERROR: Permission denied).
      # Size bumped: bge-small-en-v1.5 ONNX + HF hub metadata exceeds 200m.
      - /home/agent/.cache:rw,noexec,nosuid,size=500m,uid=1000,gid=1000
      - /home/agent/.claude:rw,nosuid,size=500m,uid=1000,gid=1000
    # Docker default pids.max=100 is too low for parallel subagents + Bash forks + bkt.
    pids_limit: 4096
    volumes:
      - agent-sessions:/data/agent-sessions
      # Host AWS SSO creds + kubeconfig for direct AWS/EKS access (local dev).
      # ~/.aws is read-WRITE so the aws CLI can refresh expired SSO access tokens
      # (it writes to ~/.aws/sso/cache); writes propagate back to the host via
      # VirtioFS, keeping the host token fresh too. ~/.kube stays read-only so the
      # agent can't change the active context (set it on the host with
      # `kubectl config use-context`). See env block above for more.
      - ${HOME}/.aws:/home/agent/.aws
      - ${HOME}/.kube:/home/agent/.kube:ro
      # Jenkins / ArgoCD / Bitbucket: set credentials in repo root .env (env_file above).
      # Argo CD CLI session (after host `argocd login`)
      - ${HOME}/.config/argocd:/home/agent/.config/argocd
    mem_limit: 2g
    cpus: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8001:8000"
    networks:
      - app_network
      - default  # Needs external access for API calls
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # Web UI — admin console + agent entry point (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  web-ui:
    build:
      context: ./web_ui
      dockerfile: Dockerfile
    container_name: opensre-web-ui
    restart: unless-stopped
    environment:
      - CONFIG_SERVICE_URL=http://config-service:8080
      - AGENT_SERVICE_URL=http://sre-agent:8000
      - WEB_UI_SSO_ORG_ID=${WEB_UI_SSO_ORG_ID:-local}
      - WEB_UI_PUBLIC_BASE_URL=${WEB_UI_PUBLIC_BASE_URL:-http://localhost:3002}
      - WEB_UI_COOKIE_SECURE=0
      - HOSTNAME=0.0.0.0
      - PORT=3000
    ports:
      - "3002:3000"
    depends_on:
      config-service:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # Slack Bot — connects Slack to SRE Agent
  # Opt-in: docker compose --profile slack up  /  make dev-slack
  # Will exit gracefully if SLACK_BOT_TOKEN and SLACK_APP_TOKEN are not configured
  # ─────────────────────────────────────────────────────────────────────────────
  slack-bot:
    build:
      context: ./slack-bot
      dockerfile: Dockerfile
    container_name: opensre-slack-bot
    profiles: ["slack"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SRE_AGENT_URL=http://sre-agent:8000
      - CONFIG_SERVICE_URL=http://config-service:8080
      - CONFIG_MODE=${CONFIG_MODE:-}
    depends_on:
      - sre-agent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cannot use read_only because app may write logs/temp files
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    volumes:
      # Mount assets read-only
      - ./slack-bot/assets:/app/assets:ro
    mem_limit: 1g
    cpus: 1
    pids_limit: 50
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network
      - default  # Needs external access to connect to Slack

  # Teams Bot — Microsoft Teams SDK → sre-agent
  # Opt-in: docker compose --profile teams up  /  make dev-teams
  # Exits gracefully if TEAMS_APP_ID / TEAMS_APP_PASSWORD / TEAMS_TENANT_ID unset
  teams-bot:
    build:
      context: ./teams-bot
      dockerfile: Dockerfile
    container_name: opensre-teams-bot
    profiles: ["teams"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SRE_AGENT_URL=http://sre-agent:8000
      - PORT=3978
    ports:
      - "3978:3978"
    depends_on:
      - sre-agent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    mem_limit: 1g
    cpus: 1
    pids_limit: 50
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network
      - default

networks:
  app_network:
    driver: bridge
    internal: true  # Internal network for inter-service communication
  default:
    driver: bridge  # Default network with external access

# Named volumes are shared across worktrees via COMPOSE_PROJECT_NAME=opensre.
# Mark external so `docker compose down -v` / `make clean` from ANY worktree
# cannot wipe investigation/memory data. Create once if missing:
#   docker volume create opensre-postgres-data
#   docker volume create opensre-neo4j-data
#   docker volume create opensre-agent-sessions
volumes:
  postgres-data:
    name: opensre-postgres-data
    external: true
  neo4j-data:
    name: opensre-neo4j-data
    external: true
  agent-sessions:
    name: opensre-agent-sessions
    external: true
