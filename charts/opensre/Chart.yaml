apiVersion: v2
name: opensre
description: AI-powered SRE platform for automated incident investigation and response
type: application
version: 1.2.1
appVersion: "1.2.1"
home: https://opensre.in
icon: https://raw.githubusercontent.com/swapnildahiphale/OpenSRE/main/web_ui/public/brand/opensre-spinner.png
sources:
  - https://github.com/swapnildahiphale/OpenSRE
keywords:
  - opensre
  - sre
  - incident-response
  - observability
  - ai
  - kubernetes
maintainers:
  - name: OpenSRE
    url: https://github.com/swapnildahiphale
annotations:
  artifacthub.io/license: "Apache-2.0"
dependencies:
  - name: postgresql
    version: "16.4.9"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: neo4j
    version: "5.26.0"
    repository: https://helm.neo4j.com/neo4j
    condition: neo4j.enabled
