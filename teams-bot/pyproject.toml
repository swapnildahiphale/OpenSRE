[project]
name = "opensre-teams-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "microsoft-teams-apps>=2.0.14",
  "microsoft-teams-cards>=2.0.14",
  "aiohttp>=3.9.0",
  "python-dotenv>=1.0.0",
  "mistune>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
